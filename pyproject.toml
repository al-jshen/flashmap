[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flashmap"
version = "0.1.0"
description = "FlashMap: flow map speculative decoding with Hugging Face transformers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "transformers>=4.56"]

[project.optional-dependencies]
benchmark = ["datasets"]

[project.urls]
Homepage = "https://github.com/al-jshen/flashmap"

[tool.setuptools]
packages = ["flashmap"]
