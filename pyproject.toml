[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flashmap"
version = "0.1.0"
description = "FlashMap: flow map speculative decoding for Hugging Face transformers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Shen" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "transformers>=4.56"]
keywords = ["speculative decoding", "flow map", "draft model", "llm inference", "transformers"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
benchmark = ["datasets"]
test = ["pytest"]
# Serve FlashMap drafters in sglang (an sglang plugin, registered below).
sglang = ["sglang==0.5.20"]
# Serve FlashMap drafters in vLLM (a vLLM general plugin, registered below).
vllm = ["vllm>=0.31,<0.32"]

[project.entry-points."sglang.srt.plugins"]
flashmap = "flashmap.sglang:register"

[project.entry-points."vllm.general_plugins"]
flashmap = "flashmap.vllm:register"

[project.urls]
Homepage = "https://jshen.net/flashmap"
Repository = "https://github.com/al-jshen/flashmap"
Documentation = "https://github.com/al-jshen/flashmap/blob/master/docs/details.md"
"Model (Qwen3-8B)" = "https://huggingface.co/j-shen/FlashMap-Qwen3-8B"
"Model (Qwen3-4B)" = "https://huggingface.co/j-shen/FlashMap-Qwen3-4B"

[tool.setuptools]
packages = ["flashmap", "flashmap.sglang", "flashmap.vllm"]
